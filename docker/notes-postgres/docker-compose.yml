services:
  web:
    build: .
    image: vanuhanda/notes-api:v1
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://notes:${POSTGRES_PASSWORD}@db:5432/notes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=notes
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    init: true

volumes:
  pgdata:
